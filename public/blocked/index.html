<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Недоступно в вашем регионе · KulshAI</title>
<meta name="theme-color" content="#07060B" />
<meta name="color-scheme" content="dark light" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/assets/logo.png" />
<link rel="apple-touch-icon" href="/assets/logo.png" />

<link rel="preload" href="/fonts/google-sans-flex-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/google-sans-flex-round-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/roboto-flex-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/material-symbols-rounded-v2.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/fonts/fonts-v2.css" />
<link rel="stylesheet" href="/errors.css?v=20261022" />

<script>
  try {
    var s = JSON.parse(localStorage.getItem('kulshgpt.settings.v1') || '{}');
    var t = s.theme || 'dark';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    document.documentElement.lang = s.lang || 'ru';
  } catch (e) {}
</script>
<link rel="stylesheet" href="/ui.css?v=20261022" />
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-shimmer">
    <div class="bg-base"></div>
    <div class="bg-shine"></div>
  </div>
  <div class="bg-vignette"></div>
</div>

<div class="shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="KulshAI">
      <img src="/assets/logo.png" alt="KulshAI" />
      <span>KulshAI</span>
    </a>
    <span class="spacer"></span>
    <div class="lang-switch" id="langSwitch">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="main">
    <div class="card" role="dialog" aria-labelledby="pageTitle">
      <div class="card-glow"></div>
      <div class="card-body">
        <div class="lottie is-empty" id="lottie" aria-hidden="true"></div>

        <span class="code-badge"><span class="dot"></span><span id="badgeLabel">Доступ ограничен</span></span>
        <h1 id="pageTitle">Увы, но Кульш недоступен в вашем регионе</h1>
        <p class="lead" id="pageSub">К сожалению, сейчас мы не можем открыть сервис для тебя. Если считаешь, что это ошибка — напиши автору, мы разберёмся.</p>

        <div class="actions">
          <a class="btn btn-filled" href="https://t.me/lolfall" target="_blank" rel="noopener noreferrer" id="btnContact">
            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="11" fill="#29A9EB"/><path fill="#fff" d="M5.4 11.8l11.2-4.3c.5-.2 1 .1.8.9l-1.9 9c-.1.6-.5.8-1 .5l-2.8-2.1-1.4 1.3c-.1.2-.3.3-.6.3l.2-2.9 5.2-4.7c.2-.2 0-.3-.3-.1l-6.4 4-2.8-.9c-.6-.2-.6-.6.1-.9z"/></svg>
            <span id="btnContactLabel">Написать автору</span>
          </a>
          <a class="btn btn-tonal" href="https://github.com/starfall-apk/kulsh-web" target="_blank" rel="noopener noreferrer" id="btnSource">
            <span class="material-symbols-rounded">code</span>
            <span id="btnSourceLabel">Исходный код</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>© 2026 KulshAI</span>
    <span class="divider">·</span>
    <a href="https://t.me/lolfall" target="_blank" rel="noopener noreferrer">Telegram автора</a>
  </footer>
</div>

<script src="/lottie.min.js"></script>
<script>
(function () {
  var T = {
    ru: {
      badge: 'Доступ ограничен',
      title: 'Увы, но Кульш недоступен в вашем регионе',
      sub: 'К сожалению, сейчас мы не можем открыть сервис для тебя. Если считаешь, что это ошибка — напиши автору, мы разберёмся.',
      contact: 'Написать автору',
      source: 'Исходный код',
    },
    en: {
      badge: 'Access restricted',
      title: "Unfortunately, Kulsh isn't available in your region",
      sub: "Right now we can't open the service for you. If you think this is a mistake, ping the author — we'll look into it.",
      contact: 'Contact author',
      source: 'Source code',
    },
  };
  function lang() {
    try {
      var s = JSON.parse(localStorage.getItem('kulshgpt.settings.v1') || '{}');
      return s.lang === 'en' ? 'en' : 'ru';
    } catch (e) { return document.documentElement.lang === 'en' ? 'en' : 'ru'; }
  }
  function apply() {
    var l = lang(), t = T[l];
    document.documentElement.lang = l;
    document.getElementById('badgeLabel').textContent = t.badge;
    document.getElementById('pageTitle').textContent = t.title;
    document.getElementById('pageSub').textContent = t.sub;
    document.getElementById('btnContactLabel').textContent = t.contact;
    document.getElementById('btnSourceLabel').textContent = t.source;
    Array.prototype.forEach.call(document.querySelectorAll('#langSwitch button'), function (b) {
      b.classList.toggle('is-active', b.dataset.lang === l);
    });
  }
  document.getElementById('langSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    try {
      var s = JSON.parse(localStorage.getItem('kulshgpt.settings.v1') || '{}');
      s.lang = b.dataset.lang;
      localStorage.setItem('kulshgpt.settings.v1', JSON.stringify(s));
    } catch (err) {}
    apply();
  });
  apply();

  window.addEventListener('DOMContentLoaded', function () {
    var host = document.getElementById('lottie');
    if (window.lottie && host) {
      host.classList.remove('is-empty');
      window.lottie.loadAnimation({
        container: host,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: '/lotties/freedom.json',
      });
    }
  });
})();
</script>
</body>
</html>
